name: Publikacja strony (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jednocześnie tylko jedno wdrożenie; nie przerywaj trwającego.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Spróbuj automatycznie włączyć Pages, jeśli jeszcze nie są aktywne.
          enablement: true

      - name: Spakuj stronę
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Opublikuj
        id: deployment
        uses: actions/deploy-pages@v4
